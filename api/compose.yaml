name: gilbert-energy-api
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: pjme_energy
      MYSQL_USER: api_user
      MYSQL_PASSWORD: local_api_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../databases/mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 30
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
      - ../databases/mongodb/init.js:/docker-entrypoint-initdb.d/01-schema.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
  mongo_data:

